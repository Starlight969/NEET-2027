<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#11111a"/>
      <stop offset="1" stop-color="#020204"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#c9c2ff"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#ffffff" stroke-opacity=".07"/>

  <!-- Crescent -->
  <path d="M38.5 13.5c-10.7 2.1-16.6 13-13.2 22.7 3.2 9.1 13.2 14.2 22.4 10.7-4.8 3.2-11.2 4.3-17.2 2.2-11.4-4-17.4-16.6-13.4-28C20.2 13.5 29.7 9.7 38.5 13.5Z"
        fill="url(#moon)" filter="url(#softGlow)"/>

  <!-- Tiny star / study spark -->
  <path d="M44 17.5l1.5 3.6 3.5 1.4-3.5 1.4-1.5 3.6-1.4-3.6-3.6-1.4 3.6-1.4 1.4-3.6Z"
        fill="#ffffff" filter="url(#softGlow)"/>
  <circle cx="48.5" cy="36" r="1.5" fill="#54e7d0"/>
  <circle cx="15.5" cy="28" r="1.2" fill="#8b7cff"/>
</svg>